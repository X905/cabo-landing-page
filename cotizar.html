  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

        {

        {

            nombre: "Closet estándar",
            descripcion: "Closet de melamina e=5/8pulg (color a elegir) 1.60 ancho X 2m alto 0.35cm de profundidad, gabinetes inferiores abiertos, 3 gavetas, segmento con colga ropa, con compuertas corredizas",
            precio: 900.00,

        },
        {
            categoria: "Cielo falso",
            nombre: "Instalación de cielo PVC",
            descripcion: "Instalación de cielo pvc, sostenido con perfilería de aluminio",
            precio: 30.00,
            unidad: "m2",
            imagen: "images/catalogo/cielo_pvc.jpg"
        },
        {
            categoria: "Planos",
            nombre: "Vivienda 1 nivel",
            descripcion: "Planos arquitectónicos para 1 nivel",
            precio: 800.00,
            duracion: "30d",
            nota: "Desde",
            imagen: "images/catalogo/planos.png"
        },
        {
            categoria: "Planos",
            nombre: "Vivienda 2 niveles",
            descripcion: "Planos arquitectónicos para 2 niveles",
            precio: 1400.00,
            duracion: "30d",
            nota: "Desde",
            imagen: "images/catalogo/planos.png"
        }
    ];

    const catalogoDiv = document.getElementById("catalogo");
    const buscadorInput = document.getElementById("buscador");
    const filtroCategoria = document.getElementById("filtroCategoria");

    const modal = new bootstrap.Modal(document.getElementById('modalProducto'));
    const modalTitulo = document.getElementById("modalProductoLabel");
    const modalDescripcion = document.getElementById("modalDescripcion");
    const modalPrecio = document.getElementById("modalPrecio");
    const modalImagen = document.getElementById("modalImagen");
    const modalWhatsapp = document.getElementById("modalWhatsapp");

    function renderizarProductos(productosFiltrados) {
      catalogoDiv.innerHTML = "";
      if (productosFiltrados.length === 0) {
        catalogoDiv.innerHTML = '<p class="text-center">No se encontraron productos.</p>';
        return;
      }
      productosFiltrados.forEach((p, i) => {
        const mensaje = encodeURIComponent(`Hola, quiero cotizar el modelo '${p.nombre}' con precio estimado $${p.precio}`);
        const card = document.createElement("div");
        card.className = "col-md-4 mb-4";
        card.innerHTML = `
          <div class="card h-100" role="button" data-index="${i}">
            <img src="${p.imagen}" class="card-img-top" alt="${p.nombre}">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">${p.nombre}</h5>
              <p class="card-text">${p.descripcion}</p>
              <p class="card-text fw-bold text-success">${(p.precio).toLocaleString('en-US', {style: 'currency',currency: 'USD'})}* <span class="text-muted small">(${p.duracion})</span></p>
              <a href="https://wa.me/50373239029?text=${mensaje}" class="btn btn-success mt-auto" target="_blank">Cotizar en WhatsApp</a>
            </div>
          </div>
        `;
        card.querySelector('.card').addEventListener('click', () => mostrarModal(p));
        catalogoDiv.appendChild(card);
      });
    }

    function mostrarModal(producto) {
      const mensaje = encodeURIComponent(`Hola, quiero cotizar el modelo '${producto.nombre}' con precio estimado $${producto.precio}`);
      modalTitulo.textContent = producto.nombre;
      modalDescripcion.textContent = producto.descripcion;
      modalPrecio.textContent = `$${producto.precio.toFixed(2)} (${producto.duracion})`;
      modalImagen.src = producto.imagen;
      modalImagen.alt = producto.nombre;
      modalWhatsapp.href = `https://wa.me/50373239029?text=${mensaje}`;
      modal.show();
    }

    function filtrarYRenderizar() {
      const texto = buscadorInput.value.toLowerCase();
      const categoria = filtroCategoria.value;

      const resultado = productos.filter(p => {
        const coincideTexto = p.nombre.toLowerCase().includes(texto) || p.descripcion.toLowerCase().includes(texto);
        const coincideCategoria = !categoria || p.categoria === categoria;
        return coincideTexto && coincideCategoria;
      });

      renderizarProductos(resultado);
    }

    function cargarCategorias() {
      const categoriasUnicas = [...new Set(productos.map(p => p.categoria))];
      categoriasUnicas.forEach(cat => {
        const opcion = document.createElement("option");
        opcion.value = cat;
        opcion.textContent = cat;
        filtroCategoria.appendChild(opcion);
      });
    }

    buscadorInput.addEventListener("input", filtrarYRenderizar);
    filtroCategoria.addEventListener("change", filtrarYRenderizar);

    cargarCategorias();
    renderizarProductos(productos);
  </script>

</body>
