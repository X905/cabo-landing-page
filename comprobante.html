<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Cabo - Portafolio">
	    <meta name="keywords" content="cabo, servicios, construccion, san miguel, pisos">
	    <title>Comprobantes - Cabo</title>
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="images/logos/cabito.ico" />

        <!-- Font Awesome icons (free version)-->
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <!-- Google fonts-->
        <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css" />
        <link href="https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700" rel="stylesheet" type="text/css" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="css/styles.css" rel="stylesheet" />
    </head>
    <body id="page-top">
         <!-- Formulario de comprobantes de pago-->
         <section class="page-section pt-3" id="contact">
             <div class="container ">
                    <a href="index.html" type="button" class="btn btn-outline-light"><span class="fa-solid fa-arrow-left"></span>Regresar</a>
                 <div class="text-center">
                    <img src="images/logos/cabito.png" class="mt-5" height="100" alt="cabito"> 
                     <h2 class="section-heading text-uppercase ">Enviar comprobante de pago</h2>
                     <h3 class="section-subheading text-muted">Sigue los pasos a continuación</h3>
                </div>
                <h3 class="fst-italic fs-6 mb-1  text-muted">1. Realiza tu pago, (omitir si su pago electronico ya fue realizado):</h3>
                <div class="wompi_button_widget" data-url-pago="https://lk.wompi.sv/tVPZ"></div>
                <form id="contactForm" >
                    <h3 class="fst-italic fs-6 mb-1 mt-3 text-muted">2. Envie captura de pantalla de su pago efectuado electronicamente</h3>
                    <div class="row align-items-stretch mb-5">
                        <div class="col-md-6">
                                <div class="form-group">
                                    <!-- Name input-->
                                    <input class="form-control" id="name" type="text" placeholder="Su nombre aqui..." data-sb-validations="required" />
                                    <div class="invalid-feedback" data-sb-feedback="name:required">indique su nombre</div>
                                </div>
                                <div class="form-group">
                                    <!-- Email address input-->
                                    <input class="form-control" id="email" type="email" placeholder="Correo electronico (opcional)*" data-sb-validations="email" />
                                    <div class="invalid-feedback" data-sb-feedback="email:email">Email is not valid.</div>
                                </div>
                                <div class="form-group mb-md-0">
                                    <!-- Phone number input-->
                                    <input class="form-control" id="file" type="file" placeholder="Subir comprobante" />
                                </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group form-group-textarea mb-md-0">
                                <!-- Message input-->
                                <textarea class="form-control" id="description" placeholder="concepto (opcional)" ></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="text-center"><button class="btn btn-primary btn-xl text-uppercase" id="submitButton" type="submit">Enviar Comprobante</button></div>
                </form>
            </div>
        </section>
        
         <!-- Bootstrap core JS-->
         <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
         <!-- Core theme JS-->
         <script src="js/scripts.js"></script>
         <!-- * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *-->
         <!-- * *                               SB Forms JS                               * *-->
         <!-- * * Activate your form at https://startbootstrap.com/solution/contact-forms * *-->
         <!-- * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *-->
         <script src="https://cdn.startbootstrap.com/sb-forms-latest.js"></script>
         <script src="https://pagos.wompi.sv/js/wompi.pagos.js"></script>
    </body>
</html>
